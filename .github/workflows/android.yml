name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests (:core)
        run: ./gradlew :core:test

      - name: Verify no network permission in merged manifests (R1)
        run: ./gradlew :app:verifyNoNetworkPermissionDebug :app:verifyNoNetworkPermissionRelease

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Check APK permissions with aapt2 (R1)
        run: scripts/check_apk_permissions.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airgaprx-release-apk
          path: app/build/outputs/apk/release/app-release.apk
