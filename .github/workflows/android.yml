name: Android CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests (:core)
        run: ./gradlew :core:test

      - name: Verify no network permission in merged manifests (R1)
        run: ./gradlew :app:verifyNoNetworkPermissionDebug :app:verifyNoNetworkPermissionRelease

      - name: Build debug APK (development knowledge base, labelled in-app)
        run: ./gradlew :app:assembleDebug

      - name: Check APK permissions with aapt2 (R1)
        run: scripts/check_apk_permissions.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: airgaprx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Release packaging only happens for version tags, and only succeeds when the bundled KB was
  # built with `build_kb.py --release` (DDInter present, every curated row reviewed). The same rule
  # is enforced at runtime from the signed KB manifest.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Release gate + build (fails on development KB)
        run: ./gradlew :app:assembleRelease
      - name: Check release APK permissions (R1)
        run: scripts/check_apk_permissions.sh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: airgaprx-release-apk
          path: app/build/outputs/apk/release/app-release.apk
